name: Deploy to server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.192.134.135
          username: chaplygin
          port: 58529
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/chaplygin/tasks/docker
            git pull origin master || git pull origin main
            podman build -t kubsu-app:latest .
            podman rm -f kubsu-app kubsu-db 2>/dev/null || true
            podman run -d --name kubsu-db --network host --restart unless-stopped \
              -e POSTGRES_USER=kubsu -e POSTGRES_PASSWORD=kubsu -e POSTGRES_DB=kubsu \
              -v pgdata:/var/lib/postgresql/data \
              postgres:16-alpine
            for i in $(seq 1 15); do
              podman exec kubsu-db pg_isready -U kubsu -d kubsu && break || sleep 2
            done
            podman run -d --name kubsu-app --network host --restart unless-stopped \
              -e DATABASE_URL=postgresql+asyncpg://kubsu:kubsu@127.0.0.1:5432/kubsu \
              localhost/kubsu-app:latest
