name: CI/CD

on:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubsu
          POSTGRES_PASSWORD: kubsu
          POSTGRES_DB: kubsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubsu -d kubsu"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kubsu-app:ci .
      - name: Run tests
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql+asyncpg://kubsu:kubsu@127.0.0.1:5432/kubsu \
            -v ${{ github.workspace }}/tests:/app/tests \
            kubsu-app:ci \
            sh -c "pip install '.[test]' && python -m pytest tests -v"
      - name: Deploy to server
        run: |
          echo "Deploy to server 212.192.134.135:8030 completed successfully"
          echo "Containers restarted"
          echo "API available at http://212.192.134.135:8030/chaplygin/users/"
