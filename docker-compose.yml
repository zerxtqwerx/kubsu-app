version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kubsu
      POSTGRES_USER: kubsu
      POSTGRES_PASSWORD: kubsu
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8030:8030"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: kubsu
      DB_USER: kubsu
      DB_PASS: kubsu
    depends_on:
      - db
